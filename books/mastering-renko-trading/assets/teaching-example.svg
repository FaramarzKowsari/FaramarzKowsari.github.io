<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Schematic chart: time-based price line contains fluctuations; Renko bricks reconstruct directional movement and hide elapsed time, with brick size changing signal detail and lag"><rect width="960" height="420" rx="20" fill="#0a1727"/><text x="32" y="43" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">Renko versus time-based candles</text><text x="32" y="72" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">The chart becomes cleaner because price is regrouped, not because risk vanishes</text><rect x="31" y="108" width="437" height="251" rx="14" fill="#14263c" stroke="#314b66"/><text x="50" y="142" fill="#69aefa" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">TIME-BASED PRICE VIEW</text><text x="50" y="166" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="start">Same input path: many fluctuations</text><rect x="50" y="185" width="392" height="143" rx="9" fill="#0a1727" stroke="none"/><path d="M62 286 L95 268 L129 276 L159 229 L181 244 L221 224 L244 251 L278 233 L302 208 L340 226 L369 199 L408 209" fill="none" stroke="#69aefa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="489" y="108" width="440" height="251" rx="14" fill="#14263c" stroke="#314b66"/><text x="509" y="142" fill="#31d0bd" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">RENKO TRANSFORM</text><text x="509" y="166" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="start">Brick size changes the decision surface</text><rect x="519" y="264" width="30" height="30" rx="1" fill="#31d0bd" stroke="#eaf4ff"/><rect x="551" y="232" width="30" height="30" rx="1" fill="#31d0bd" stroke="#eaf4ff"/><rect x="583" y="200" width="30" height="30" rx="1" fill="#31d0bd" stroke="#eaf4ff"/><rect x="615" y="232" width="30" height="30" rx="1" fill="#ff7981" stroke="#eaf4ff"/><rect x="647" y="200" width="30" height="30" rx="1" fill="#31d0bd" stroke="#eaf4ff"/><rect x="679" y="168" width="30" height="30" rx="1" fill="#31d0bd" stroke="#eaf4ff"/><rect x="711" y="200" width="30" height="30" rx="1" fill="#ff7981" stroke="#eaf4ff"/><rect x="743" y="168" width="30" height="30" rx="1" fill="#31d0bd" stroke="#eaf4ff"/><rect x="775" y="136" width="30" height="30" rx="1" fill="#31d0bd" stroke="#eaf4ff"/><text x="510" y="336" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">Smaller bricks: detail  |  Larger bricks: fewer turns, more lag</text><text x="32" y="402" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" text-anchor="start">Educational diagram based on the book · not a trading signal</text></svg>