<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="A four-stage ninety-day roadmap: foundations days 1 to 15, one setup and backtesting 16 to 35, simulation 36 to 65, review and possible transition 66 to 90"><rect width="960" height="420" rx="20" fill="#0a1727"/><text x="32" y="43" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">From beginner to a written trading process</text><text x="32" y="72" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">The book's actual Chapter 12 organizes learning into four stages</text><rect x="32" y="99" width="221" height="270" rx="14" fill="#14263c" stroke="#314b66"/><rect x="32" y="99" width="221" height="8" rx="4" fill="#69aefa" stroke="none"/><text x="49" y="139" fill="#69aefa" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start">01</text><text x="49" y="173" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">DAYS 1–15</text><text x="49" y="202" fill="#69aefa" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">FOUNDATIONS</text><circle cx="53" cy="236" r="3.5" fill="#69aefa"/><text x="65" y="242" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Read candles and orders</text><circle cx="53" cy="275" r="3.5" fill="#69aefa"/><text x="65" y="281" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Observe without predicting</text><circle cx="53" cy="314" r="3.5" fill="#69aefa"/><text x="65" y="320" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Notebook + AI tutor</text><text x="257" y="234" fill="#ffc77d" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">›</text><rect x="265" y="99" width="221" height="270" rx="14" fill="#14263c" stroke="#314b66"/><rect x="265" y="99" width="221" height="8" rx="4" fill="#31d0bd" stroke="none"/><text x="282" y="139" fill="#31d0bd" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start">02</text><text x="282" y="173" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">DAYS 16–35</text><text x="282" y="202" fill="#31d0bd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">ONE SETUP</text><circle cx="286" cy="236" r="3.5" fill="#31d0bd"/><text x="298" y="242" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Define entry and no-trade</text><circle cx="286" cy="275" r="3.5" fill="#31d0bd"/><text x="298" y="281" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Collect 50 historical cases</text><circle cx="286" cy="314" r="3.5" fill="#31d0bd"/><text x="298" y="320" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Audit rules before testing</text><text x="490" y="234" fill="#ffc77d" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">›</text><rect x="498" y="99" width="221" height="270" rx="14" fill="#14263c" stroke="#314b66"/><rect x="498" y="99" width="221" height="8" rx="4" fill="#ffc77d" stroke="none"/><text x="515" y="139" fill="#ffc77d" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start">03</text><text x="515" y="173" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">DAYS 36–65</text><text x="515" y="202" fill="#ffc77d" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">SIMULATION</text><circle cx="519" cy="236" r="3.5" fill="#ffc77d"/><text x="531" y="242" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Follow identical rules</text><circle cx="519" cy="275" r="3.5" fill="#ffc77d"/><text x="531" y="281" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Screenshot and journal</text><circle cx="519" cy="314" r="3.5" fill="#ffc77d"/><text x="531" y="320" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Review violations weekly</text><text x="723" y="234" fill="#ffc77d" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">›</text><rect x="731" y="99" width="221" height="270" rx="14" fill="#14263c" stroke="#314b66"/><rect x="731" y="99" width="221" height="8" rx="4" fill="#ff7981" stroke="none"/><text x="748" y="139" fill="#ff7981" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start">04</text><text x="748" y="173" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">DAYS 66–90</text><text x="748" y="202" fill="#ff7981" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">DECISION GATE</text><circle cx="752" cy="236" r="3.5" fill="#ff7981"/><text x="764" y="242" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Audit results and discipline</text><circle cx="752" cy="275" r="3.5" fill="#ff7981"/><text x="764" y="281" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Return to testing if needed</text><circle cx="752" cy="314" r="3.5" fill="#ff7981"/><text x="764" y="320" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Live exposure is optional</text><text x="32" y="402" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" text-anchor="start">Educational diagram based on the book · not a trading signal</text></svg>