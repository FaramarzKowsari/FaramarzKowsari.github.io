<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Side by side conceptual line charts: valid sequence with liquidity event, displacement and retracement, versus invalid fair value gap with missing prior liquidity and structural conditions"><rect width="960" height="420" rx="20" fill="#0a1727"/><text x="32" y="43" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="start">ICT Silver Bullet: pattern vs eligible setup</text><text x="32" y="72" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">The book rejects a visually attractive FVG when the sequence is incomplete</text><rect x="32" y="103" width="435" height="270" rx="15" fill="#14263c" stroke="#314b66"/><rect x="32" y="103" width="435" height="8" rx="4" fill="#31d0bd" stroke="none"/><text x="50" y="145" fill="#31d0bd" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">ELIGIBLE SEQUENCE</text><text x="50" y="174" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">Liquidity → displacement → FVG</text><rect x="51" y="193" width="395" height="117" rx="10" fill="#0a1727" stroke="none"/><line x1="58" y1="262" x2="435" y2="262" stroke="#314b66" stroke-width="2" stroke-dasharray="5 5"/><polyline points="63,255 98,234 122,247 153,211 183,207 215,258 245,280 276,234 305,209 351,191 429,170" stroke="#31d0bd" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="339" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">Require retracement and defined invalidation</text><rect x="494" y="103" width="435" height="270" rx="15" fill="#14263c" stroke="#314b66"/><rect x="494" y="103" width="435" height="8" rx="4" fill="#ff7981" stroke="none"/><text x="512" y="145" fill="#ff7981" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start">REJECT THE PATTERN</text><text x="512" y="174" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">Gap exists · no prior sweep or shift</text><rect x="513" y="193" width="395" height="117" rx="10" fill="#0a1727" stroke="none"/><line x1="520" y1="262" x2="897" y2="262" stroke="#314b66" stroke-width="2" stroke-dasharray="5 5"/><polyline points="524,255 570,237 609,256 648,224 679,241 715,216 751,215 792,239 833,224 896,248" stroke="#ff7981" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="514" y="339" fill="#edf5ff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">An attractive FVG alone is insufficient</text><text x="32" y="402" fill="#9bb2c8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" text-anchor="start">Educational diagram based on the book · not a trading signal</text></svg>