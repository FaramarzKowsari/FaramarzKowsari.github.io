name: Build source-reviewed book pages

on:
  workflow_dispatch:
  push:
    paths:
      - "books/source_reviews/**"
      - "scripts/build_books.py"
      - ".github/workflows/build-source-reviewed-books.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build reviewed book pages
        run: python scripts/build_books.py

      - name: Commit generated book files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/books.json books/completed.json books/*/index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: publish source-reviewed book pages"
            git push
          fi
