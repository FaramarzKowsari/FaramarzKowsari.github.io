name: Build public book pages

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "books/catalog-additions.json"
      - "books/catalog-additions*.json"
      - "books/source_reviews/**"
      - "books/source-reviewed-extra.json"
      - "books/library-source-enriched*.json"
      - "books/localizations/**"
      - "books/pinterest-infographics.json"
      - "books/author/entity.json"
      - "books/images/faramarz-kowsari-author.jpg"
      - "scripts/merge_catalog_additions.py"
      - "scripts/semantic_seo_books.py"
      - "scripts/resolve_google_books_covers.py"
      - "scripts/apply_google_books_covers.py"
      - "scripts/build_google_books_cover_gallery.py"
      - "scripts/image_seo_quality_gate.py"
      - "scripts/seo_quality_gate.py"
      - "scripts/author_entity_layer.py"
      - "scripts/apply_library_source_enrichment.py"
      - "scripts/build_books.py"
      - "scripts/seo_books.py"
      - "scripts/clean_public_book_pages.py"
      - "scripts/add_google_books_previews.py"
      - "scripts/add_author_links.py"
      - "scripts/build_topic_index.py"
      - "scripts/wcag_books.py"
      - "scripts/brand_social_preview.py"
      - "scripts/build_ai_discovery.py"
      - "scripts/ai_visibility_hardening.py"
      - "scripts/build_russian_book_pages.py"
      - "scripts/build_turkish_book_pages.py"
      - "scripts/build_market_language_pages.py"
      - "scripts/add_pinterest_infographics.py"
      - "scripts/add_ielts_sos_visual_companion.py"
      - "scripts/image_seo_books.py"
      - "scripts/enforce_google_books_alt.py"
      - "scripts/seo_sitemaps.py"
      - ".github/workflows/build-source-reviewed-books.yml"

permissions:
  contents: write

concurrency:
  group: site-generation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build SEO book pages, public copy, accessibility, AI discovery, author entity and localized landing pages
        run: |
          python scripts/merge_catalog_additions.py
          python scripts/resolve_google_books_covers.py
          python scripts/build_books.py
          python scripts/semantic_seo_books.py prepare
          python scripts/seo_books.py
          python scripts/apply_library_source_enrichment.py
          python scripts/clean_public_book_pages.py
          python scripts/add_google_books_previews.py
          python scripts/add_author_links.py
          python scripts/build_topic_index.py
          python scripts/wcag_books.py
          python scripts/brand_social_preview.py --books-only
          python scripts/build_ai_discovery.py
          python scripts/ai_visibility_hardening.py
          python scripts/build_russian_book_pages.py
          python scripts/build_turkish_book_pages.py
          python scripts/build_market_language_pages.py
          python scripts/semantic_seo_books.py apply
          python scripts/add_pinterest_infographics.py
          python scripts/add_ielts_sos_visual_companion.py
          python scripts/apply_google_books_covers.py
          python scripts/image_seo_books.py
          python scripts/enforce_google_books_alt.py
          python scripts/author_entity_layer.py
          python scripts/build_google_books_cover_gallery.py
          python scripts/seo_sitemaps.py
          python scripts/image_seo_quality_gate.py
          python scripts/seo_quality_gate.py

      - name: Commit generated book files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage generated site output broadly instead of relying on shell globs
          # that can fail when a language currently has zero generated pages.
          git add -A -- books sitemap.xml sitemap-index.xml llms.txt llms-full.txt index.html

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: publish SEO, entity-linked, accessible and localized book pages"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying push ($attempt/4)..."
            sleep $((attempt * 2))
          done

          echo "Could not publish generated book files after retries."
          exit 1
