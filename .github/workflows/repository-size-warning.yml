name: Repository size warning

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-repository-size:
    name: Check repository size
    runs-on: ubuntu-latest
    env:
      WARNING_LIMIT_KB: "512000"
      WARNING_LIMIT_MB: "500"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check GitHub repository size
        shell: bash
        run: |
          set -euo pipefail

          SIZE_KB="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.size')"
          SIZE_MB="$(awk -v kb="$SIZE_KB" 'BEGIN { printf "%.2f", kb / 1024 }')"

          {
            echo "## Repository size check"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Current size reported by GitHub: **${SIZE_MB} MB** (${SIZE_KB} KB)"
            echo "- Warning threshold: **${WARNING_LIMIT_MB} MB**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if (( SIZE_KB >= WARNING_LIMIT_KB )); then
            echo "::warning title=Repository size warning::Repository size is ${SIZE_MB} MB, at or above the ${WARNING_LIMIT_MB} MB warning threshold."
            echo "⚠️ **Warning:** repository size has reached or exceeded ${WARNING_LIMIT_MB} MB." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ Repository size is below the warning threshold." >> "$GITHUB_STEP_SUMMARY"
