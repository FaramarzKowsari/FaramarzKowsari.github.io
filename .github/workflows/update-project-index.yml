name: Update project hub index

on:
  workflow_dispatch:
  push:
    paths:
      - "books/books.json"
      - "books/completed.json"
      - "books/source-reviewed-extra.json"
      - "books/index.html"
      - "books/*/index.html"
      - "scripts/update_project_index.py"
      - "scripts/build_ai_discovery.py"
      - "scripts/ai_visibility_hardening.py"
      - "scripts/seo_sitemaps.py"
      - "scripts/seo_root.py"
      - "scripts/wcag_root.py"
      - "scripts/brand_social_preview.py"
      - ".github/workflows/update-project-index.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: site-generation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Generate repository index, AI discovery, localized book pages, SEO and accessibility hardening
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_project_index.py
          python scripts/build_ai_discovery.py
          python scripts/ai_visibility_hardening.py
          python scripts/build_russian_book_pages.py
          python scripts/build_turkish_book_pages.py
          python scripts/seo_sitemaps.py
          python scripts/seo_root.py
          python scripts/wcag_root.py
          python scripts/brand_social_preview.py --root-only

      - name: Commit changes if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- projects.json sitemap.xml sitemap-index.xml books/sitemap.xml books/sitemap-ru.xml books/sitemap-tr.xml index.html app.js books/index.html books/*/index.html books/*/ru/index.html books/ru/index.html books/*/tr/index.html books/tr/index.html llms.txt llms-full.txt books/catalog.json books/all-books/index.html

          if git diff --cached --quiet; then
            echo "No project-index, AI-discovery, localized-page, SEO or accessibility changes."
            exit 0
          fi

          git commit -m "chore: refresh project hub, AI discovery, localized book pages, SEO and accessibility"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying push ($attempt/4)..."
            sleep $((attempt * 2))
          done

          echo "Could not publish project-hub changes after retries."
          exit 1
