name: Update project hub index

on:
  workflow_dispatch:
  push:
    paths:
      - "books/completed.json"
      - "books/source-reviewed-extra.json"
      - "books/index.html"
      - "books/*/index.html"
      - "scripts/update_project_index.py"
      - "scripts/seo_sitemaps.py"
      - "scripts/seo_root.py"
      - ".github/workflows/update-project-index.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: project-hub-index
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Generate repository index and SEO sitemaps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_project_index.py
          python scripts/seo_sitemaps.py
          python scripts/seo_root.py

      - name: Commit changes if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- projects.json sitemap.xml books/sitemap.xml index.html

          if git diff --cached --quiet; then
            echo "No project-index or SEO changes."
            exit 0
          fi

          git commit -m "chore: refresh project hub and SEO sitemaps"
          git push
